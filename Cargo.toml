[workspace]
resolver = "2"
members = [
    "crates/nmr-core",
    "crates/nmr-gpu",
    "crates/nmr-cli",
    "crates/nmr-gui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Debashish Sahu <debashish.sahu@gmail.com>"]
repository = "https://github.com/debsahu/nmr-assign"
description = "Open source GPU-accelerated protein NMR resonance assignment and interactive WebGPU spectrum workbench"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
wgpu = "30.0"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
