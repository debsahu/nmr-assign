name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-lint:
    name: Test, Lint & Benchmark Gate (CPU + WebGPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & Mesa Vulkan (Lavapipe) packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting with rustfmt
        run: cargo fmt --all -- --check

      - name: Lint workspace with Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness

      - name: Run workspace release test suite (nmr-core + nmr-gpu parity)
        run: cargo test --release --workspace

      - name: Realistic Bruker 5-Seed Benchmark Gate (standard >= 82% Acc / >= 90% HC Prec; evo-graph >= 95% Acc / >= 96% HC Prec)
        shell: bash
        run: |
          set -euo pipefail
          OUT_STD="$(CARGO_TERM_COLOR=never cargo run --release -p nmr-cli -- benchmark --star data/fixtures/synthetic_ubiquitin.str --realistic --seeds 5 --solver standard --engine cpu)"
          echo "=== standard (--realistic --seeds 5) ==="
          echo "$OUT_STD"
          OUT_EVO="$(CARGO_TERM_COLOR=never cargo run --release -p nmr-cli -- benchmark --star data/fixtures/synthetic_ubiquitin.str --realistic --seeds 5 --solver evo-graph)"
          echo "=== evo-graph (--realistic --seeds 5) ==="
          echo "$OUT_EVO"
          OUT_STD_TEXT="$OUT_STD" OUT_EVO_TEXT="$OUT_EVO" python3 - <<'PY'
          import os, re, sys

          def check_gate(label, out, min_acc, min_hcp):
              acc_m = re.search(r"accuracy\s*\(correct/assigned\)\s*:\s*([0-9]+(?:\.[0-9]+)?)%", out)
              hcp_m = re.search(r"high-confidence\s*\(>=0\.8\)\s*precision\s*:\s*([0-9]+(?:\.[0-9]+)?)%", out)
              if not acc_m or not hcp_m:
                  print(f"ERROR: failed to parse {label} benchmark metrics from nmr-cli output", file=sys.stderr)
                  sys.exit(1)
              acc = float(acc_m.group(1))
              hcp = float(hcp_m.group(1))
              print(f"Parsed {label} realistic 5-seed gate -> accuracy={acc:.1f}% (min {min_acc:.1f}%), hc_precision={hcp:.1f}% (min {min_hcp:.1f}%)")
              if acc < min_acc:
                  print(f"FAIL: {label} accuracy {acc:.1f}% regressed below {min_acc:.1f}% gate", file=sys.stderr)
                  sys.exit(1)
              if hcp < min_hcp:
                  print(f"FAIL: {label} high-confidence precision {hcp:.1f}% regressed below {min_hcp:.1f}% gate", file=sys.stderr)
                  sys.exit(1)

          check_gate("standard", os.environ["OUT_STD_TEXT"], 82.0, 90.0)
          check_gate("evo-graph", os.environ["OUT_EVO_TEXT"], 95.0, 96.0)
          PY

  wasm-check:
    name: WebAssembly + WebGPU GUI Check (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain with wasm32-unknown-unknown
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & WASM target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: Check nmr-gui for wasm32-unknown-unknown
        run: cargo check --release -p nmr-gui --target wasm32-unknown-unknown
